<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupportPilot Chatbot</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="SupportPilot_CB_Main.css">
</head>
<body>

<div id="sp-chat-widget">
  <!-- Floating Toggle Button -->
  <button id="sp-chat-toggle" onclick="spToggleChat()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  </button>

  <!-- Chat Window -->
  <div id="sp-chat-window" class="sp-hidden">
    <!-- Header -->
    <div class="sp-chat-header">
      <div class="sp-header-info">
        <div class="sp-avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/>
            <path d="M12 6a6 6 0 1 0 6 6 6 6 0 0 0-6-6z"/>
          </svg>
        </div>
        <div>
          <h3 class="sp-title">SupportPilot – AI Assistant</h3>
          <p class="sp-subtitle">Online</p>
        </div>
      </div>
      <button class="sp-close-btn" onclick="spToggleChat()">✕</button>
    </div>

    <!-- Messages Container -->
    <div id="sp-chat-messages">
      <div class="sp-message sp-bot">
        Hi there! 👋 How can I help you today?
      </div>
    </div>

    <!-- Input Area -->
    <div class="sp-chat-input-container">
      <div class="sp-input-wrapper">
        <input type="text" id="sp-chat-input" placeholder="Send a message..." onkeydown="if(event.key==='Enter') spSendMessage()" />
        <button id="sp-send-btn" onclick="spSendMessage()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="sp-footer-branding">
        Powered by <strong>SupportPilot</strong>
      </div>
    </div>
  </div>
</div>

<!-- Custom JavaScript -->
<script src="SupportPilot_CB_Main.js"></script>

</body>
</html>
